# Entorno local (ADR 002): LocalStack Community.
# AWS real no usa este archivo.
# Referencia de labs: cloud-foundations-lab (lab 04+).

services:
  localstack:
    image: localstack/localstack:4.14.0
    container_name: poc-cloud-foundation-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: ec2,iam,sts,s3
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  localstack_data:
